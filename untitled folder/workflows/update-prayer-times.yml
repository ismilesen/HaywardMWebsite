name: Update prayer times

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: prayer-time-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Retrieve and validate schedule
        run: python scripts/fetch-prayer-times.py

      - name: Commit changed schedule
        run: |
          if git diff --quiet -- data/prayer-times.json; then
            echo "Prayer schedule has not changed."
            exit 0
          fi

          git config user.name "masjid-prayer-times-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prayer-times.json
          git commit -m "Update prayer times"
          git push
